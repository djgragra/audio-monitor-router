<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Monitor Router</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Audio Monitor Router</h1>
    <span class="spacer"></span>
    <button id="btnRefresh" class="btn" type="button"></button>
    <button id="btnSettings" class="btn" type="button"></button>
  </header>
  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <main id="matrix" class="matrix"></main>
  <div id="settings" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
