name: Build installers

on:
  push:
    tags: ['v*']
  # Start from the Actions tab (or from a chat) with a version to build AND publish the release:
  # the tag is created by GitHub on the tip of main. Without a version it only builds.
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (the one in package.json, for example 26.10.8). Empty = build only."
        required: false
        default: ""

jobs:
  # A release must carry the version in package.json, and it must be higher than the latest
  # release: the in-app update check only offers strictly newer versions.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package.json and is newer than the latest release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$RELEASE_VERSION" ]; then
            TAG="${RELEASE_VERSION#v}"
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::A release started by hand must run on main (this run is on $GITHUB_REF_NAME)"; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$TAG" >/dev/null 2>&1; then
              echo "::error::Tag v$TAG already exists: use a higher version, or delete the unused tag first"; exit 1
            fi
          fi
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"; exit 1
          fi
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          LATEST="${LATEST#v}"
          echo "package.json: $VERSION  latest release: ${LATEST:-none}"
          if [ -n "$LATEST" ]; then
            node -e '
              const p = (v) => v.split(".").map((n) => parseInt(n, 10) || 0);
              const [a, b] = [p(process.argv[1]), p(process.argv[2])];
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const d = (a[i] || 0) - (b[i] || 0);
                if (d) process.exit(d > 0 ? 0 : 1);
              }
              process.exit(1);
            ' "$VERSION" "$LATEST" || { echo "::error::Version $VERSION must be greater than the latest release $LATEST"; exit 1; }
          fi

  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: npm ci --ignore-scripts
      - run: npm test

  # The user manual in English, Italian and Spanish, as three PDFs attached to the release (apps/STANDARD.md).
  manuals:
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the three manuals
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p manuals
          python3 docs/manual/build.py "$VERSION" manuals
          ls -l manuals
      - name: Upload manuals artifact
        uses: actions/upload-artifact@v7
        with:
          name: audio-monitor-router-manuals
          path: manuals/*.pdf
          if-no-files-found: error
          retention-days: 1

  # Windows only for now. macOS is added when it has been tried on a real machine.
  build:
    needs: [check-version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # A console program (the app starts it with its window hidden): a windowed one has no stdin/stdout to talk through.
      - name: Build the audio engine (one program, no Python needed on the user's computer)
        shell: bash
        run: |
          pip install numpy sounddevice pycaw pyinstaller
          cd engine
          pyinstaller --onefile --name amr-engine --collect-all _sounddevice_data --hidden-import sounddevice --collect-submodules pycaw --collect-submodules comtypes run.py
          ./dist/amr-engine.exe --selftest
          # information only: what the level meters see on this machine (the log tells us if COM misbehaves)
          ./dist/amr-engine.exe --meters-list || echo "meters-list exit code $?"
          mkdir -p ../build-engine
          cp dist/amr-engine.exe ../build-engine/amr-engine.exe

      - name: Install dependencies
        run: npm ci

      - name: Build the Windows installer
        run: npm run dist:win
        env:
          # No signing certificate: the README explains the first-launch warning.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: audio-monitor-router-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 1  # a preview is only needed for a day; a release copies it to GitHub Releases

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != '')
    needs: [build, manuals]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Is this a beta (0.N.P)?
        id: version
        run: |
          V=$(node -p "require('./package.json').version")
          case "$V" in 0.*) echo "beta=true" >> "$GITHUB_OUTPUT" ;; *) echo "beta=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # versions that start with 0. are betas: published as pre-release, so the update check ignores them
          prerelease: ${{ steps.version.outputs.beta }}
          # tag pushed: its own name; started by hand: v<version>, created by GitHub on this commit
          tag_name: ${{ github.event.inputs.release_version != '' && format('v{0}', github.event.inputs.release_version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
